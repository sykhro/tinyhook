name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / Clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: x86
          - os: windows-latest
            arch: x64
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CTEST_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Resolve latest stable LLVM release
        id: llvm
        uses: actions/github-script@v8
        with:
          script: |
            const {data} = await github.rest.repos.getLatestRelease({owner: 'llvm', repo: 'llvm-project'});
            const version = data.tag_name.replace(/^llvmorg-/, '');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`Unexpected LLVM release: ${data.tag_name}`);
            core.setOutput('version', version);
            const windows = data.assets.find(a => a.name === `clang+llvm-${version}-x86_64-pc-windows-msvc.tar.xz`);
            if (!windows) throw new Error('Latest LLVM release has no Windows x64 archive');
            core.setOutput('windows-url', windows.browser_download_url);
      - name: Set up Clang and Ninja
        if: runner.os != 'Windows'
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-${{ steps.llvm.outputs.version }}
          ninja: true
      - name: Install latest Clang on Windows
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ steps.llvm.outputs.version }}
          force-url: ${{ steps.llvm.outputs.windows-url }}
          directory: ${{ runner.temp }}/llvm
      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        run: python -m pip install --upgrade ninja
      - name: Install latest stable CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: latest
      - name: Set up Windows SDK and runtime
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Select Clang explicitly
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            llvm_bin="$(cygpath -u "$LLVM_PATH")/bin"
            echo "$(cygpath -w "$llvm_bin")" >> "$GITHUB_PATH"
            echo "CC=$LLVM_PATH/bin/clang-cl.exe" >> "$GITHUB_ENV"
            echo "CXX=$LLVM_PATH/bin/clang-cl.exe" >> "$GITHUB_ENV"
            "$llvm_bin/clang-cl.exe" --version
          else
            echo "CC=$(command -v clang)" >> "$GITHUB_ENV"
            echo "CXX=$(command -v clang++)" >> "$GITHUB_ENV"
            clang --version
          fi
          cmake --version
          ninja --version
      - name: Build and test Linux variants
        if: runner.os == 'Linux'
        run: |
          cmake --workflow --preset linux-relay
          cmake --workflow --preset linux-sanitize
          cmake --workflow --preset linux-small
          cmake --install build/linux-small --prefix dist --strip --component tinyhook-runtime
      - name: Build and test macOS variants
        if: runner.os == 'macOS'
        run: |
          cmake --workflow --preset macos-small
          cmake --workflow --preset macos-vm
          mkdir -p compiled-profiles
          build/macos-vm/bin/th-compile scripts/engines/siglusengine4-x86.luau compiled-profiles/siglusengine4-x86.luauc
          build/macos-vm/bin/th-host --script-dir compiled-profiles --check
          cmake --install build/macos-vm --prefix dist --strip --component tinyhook-runtime
      - name: Build and test Windows with clang-cl
        if: runner.os == 'Windows'
        run: |
          cmake --workflow --preset clang-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build/clang-${{ matrix.arch }} --prefix dist --component tinyhook-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: tinyhook-${{ runner.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
