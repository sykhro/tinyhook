name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / Clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            arch: x64
          - os: macos-26
            arch: arm64
          - os: windows-2025-vs2026
            arch: x86
          - os: windows-2025-vs2026
            arch: x64
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CTEST_PARALLEL_LEVEL: 2
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Windows SDK and runtime
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest
          python-version: '3'
          activate-environment: true
          enable-cache: true
      - name: Install build tools with uv
        run: uv pip install --upgrade -r requirements-dev.txt
      - name: Install latest stable LLVM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project python infra/ci/install_llvm.py
      - name: Show tool versions
        run: |
          uv run --no-project python --version
          uv run --no-project cmake --version
          uv run --no-project ninja --version
      - name: Build and test Linux variants
        if: runner.os == 'Linux'
        run: |
          uv run --no-project cmake --workflow --preset linux-relay
          uv run --no-project cmake --workflow --preset linux-sanitize
          uv run --no-project cmake --workflow --preset linux-small
          uv run --no-project cmake --install build/linux-small --prefix dist --strip --component tinyhook-runtime
      - name: Build and test macOS variants
        if: runner.os == 'macOS'
        run: |
          uv run --no-project cmake --workflow --preset macos-small
          uv run --no-project cmake --workflow --preset macos-vm
          mkdir -p compiled-profiles
          uv run --no-project build/macos-vm/bin/th-compile scripts/engines/siglusengine4-x86.luau compiled-profiles/siglusengine4-x86.luauc
          uv run --no-project build/macos-vm/bin/th-host --script-dir compiled-profiles --check
          uv run --no-project cmake --install build/macos-vm --prefix dist --strip --component tinyhook-runtime
      - name: Build and test Windows with clang-cl
        if: runner.os == 'Windows'
        run: |
          uv run --no-project cmake --workflow --preset clang-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-project cmake --install build/clang-${{ matrix.arch }} --prefix dist --component tinyhook-runtime
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tinyhook-${{ runner.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
